name: Publication
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Publication validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate publication
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = 'ClearDNS <contact@cleardns.io>'
          for commit in git('rev-list', 'HEAD').splitlines():
              data = git('show', '-s', '--format=%an <%ae>%n%cn <%ce>%n%B', commit).split('\n', 2)
              if data[:2] != [expected, expected]:
                  raise SystemExit('Commit identity does not match the publisher')
              if re.search(r'(?im)^\s*co[- ]authored[- ]by\s*:', data[2]):
                  raise SystemExit('Additional author trailers are not permitted')
          allowed = {
              'README.md', 'LICENSE', 'CITATION.cff', 'SHA256SUMS',
              'ClearDNS-Accountless-Authentication.md',
              'ClearDNS-Accountless-Authentication.pdf',
              '.github/workflows/publication.yml',
          }
          if set(git('ls-files', '-z').split('\0')) - {''} != allowed:
              raise SystemExit('Unexpected or missing publication files')
          sums = {}
          for line in pathlib.Path('SHA256SUMS').read_text().splitlines():
              digest, filename = line.split(None, 1)
              filename = filename.lstrip('*')
              if filename in sums:
                  raise SystemExit('Duplicate checksum entry')
              sums[filename] = digest
          documents = {'ClearDNS-Accountless-Authentication.md', 'ClearDNS-Accountless-Authentication.pdf'}
          if set(sums) != documents:
              raise SystemExit('Unexpected or missing document checksums')
          for filename, expected_digest in sums.items():
              if hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest() != expected_digest:
                  raise SystemExit('Document checksum mismatch')
          print('Publication validation passed')
          PY
